services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ipp
      POSTGRES_PASSWORD: ipp
      POSTGRES_DB: ipp_comparator
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
volumes:
  pgdata: